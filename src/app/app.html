<h1 style="padding: 2rem; font-family: Inter, sans-serif;">
  Design System — TaskFlow
</h1>

<div style="display: flex; gap: 1rem; padding: 2rem; flex-wrap: wrap;">

  <app-button variant="primary">Salvar projeto</app-button>
  <app-button variant="secondary">Cancelar</app-button>
  <app-button variant="danger">Deletar</app-button>
  <app-button variant="ghost">Ver detalhes</app-button>

</div>

<div style="display: flex; gap: 1rem; padding: 2rem; flex-wrap: wrap;">

  <app-button size="sm">Pequeno</app-button>
  <app-button size="md">Médio</app-button>
  <app-button size="lg">Grande</app-button>

</div>

<div style="padding: 2rem; max-width: 300px;">

<app-button [fullWidth]="true">Botão largura total</app-button>
</div>
