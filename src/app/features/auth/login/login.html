<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <h1 class="login-title">TaskFlow</h1>
      <p class="login-subtitle">Entre na sua conta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label class="form-label">Email</label>
        <input
          class="form-input"
          type="email"
          placeholder="seu@email.com"
          formControlName="email"
        />
        
        <span
          class="form-error"
          *ngIf="f['email'].invalid && f['email'].touched"
        >
          Email inválido
        </span>
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input
          class="form-input"
          type="password"
          placeholder="••••••••"
          formControlName="password"
        />
        <span
          class="form-error"
          *ngIf="f['password'].invalid && f['password'].touched"
        >
          Senha deve ter pelo menos 6 caracteres
        </span>
      </div>

      <div class="form-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <app-button
        type="submit"
        [fullWidth]="true"
        [disabled]="loading"
      >
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </app-button>

    </form>

    <p class="login-footer">
      Não tem conta?
      <a routerLink="/register">Criar conta</a>
    </p>

  </div>
</div>
