<div
  *ngIf="open"
  class="modal-overlay"
  (click)="onOverlayClick($event)"
>
  <div [class]="'modal modal--' + size">

    <div class="modal__header">
      <h3 class="modal__title">{{ title }}</h3>

      <button class="modal__close" (click)="onClose()" type="button">
        ✕
      </button>
    </div>

    <div class="modal__body">
      <ng-content />
    </div>

  </div>
</div>
